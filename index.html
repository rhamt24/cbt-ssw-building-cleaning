<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Building Cleaning SSW</title>
<style>
:root{--bg:#eef1f6;--c:#fff;--t:#1b2333;--m:#5d6880;--p:#1f4fd8;--ok:#14803c;--no:#c62828;--b:#d3d9e6}
@media(prefers-color-scheme:dark){:root{--bg:#0f131c;--c:#181e2c;--t:#e7ebf4;--m:#97a1b8;--b:#2a3550;--p:#6d93ff;--ok:#4ade80;--no:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.55 system-ui,"Noto Sans JP",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.35rem;margin:8px 0}
.card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:16px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.btn{background:var(--p);color:#fff;border:0;border-radius:6px;padding:10px 18px}
.btn.g{background:none;color:var(--t);border:1px solid var(--b)}
.btn.s{border:2px solid var(--p)}
.btn:disabled{opacity:.4;cursor:default}
.opt{display:block;width:100%;text-align:left;background:var(--c);border:1px solid var(--b);border-radius:6px;padding:12px;margin:8px 0}
.opt.s{border:2px solid var(--p);background:color-mix(in srgb,var(--p) 12%,var(--c))}
.top{display:flex;justify-content:space-between;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:1}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal button{width:38px;height:38px;border-radius:6px;border:1px solid var(--b);background:var(--c)}
.pal .d{background:var(--p);color:#fff;border-color:var(--p)}
.pal .f{box-shadow:0 0 0 2px #f59e0b}
.pal .c{border:2px solid var(--t);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.m{color:var(--m);font-size:.9rem}.g1{color:var(--ok)}.r1{color:var(--no)}
img{max-width:100%;height:auto;border:1px solid var(--b);border-radius:6px;display:block;margin:0 auto 12px;cursor:zoom-in}
img.z{max-width:none;width:160%;cursor:zoom-out}
.zw{overflow:auto}
.fc{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:2.1rem;cursor:pointer;user-select:none}.fc .s{font-size:1.15rem;color:var(--m);margin-top:8px}
</style></head><body><main id="a"></main>
<script>
const $=s=>document.querySelector(s),sh=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
/* Q(halaman, soal ID, soal JP, [opsi ID: benar PERTAMA], [opsi JP], penjelasan, f=lantai/kotoran) */
const Q=(p,q,j,o,oj,e,f)=>({p,q,j,o,oj,e,f});
const D=[
Q(62,"Menurut gambar, mana yang termasuk lantai elastis (弾性床材)?","弾性床材はどれですか。",["Vinil, linoleum, karet","Batu, keramik, beton","Flooring kayu, gabus","Karpet ubin"],["ビニル系、リノリウム系、ゴム系","石材、陶磁器、コンクリート","フローリング、コルク","タイルカーペット"],"Hal. 62.",1),
Q(62,"Batu alam, keramik (陶磁器/kramik) dan beton termasuk jenis lantai...","石材・陶磁器・コンクリートの床材は何ですか。",["Keras (硬性床材)","Elastis","Kayu","Karpet"],["硬性床材","弾性床材","木質床材","カーペット床材"],"Hal. 62: batu, keramik, beton = lantai keras.",1),
Q(62,"Flooring dan gabus (コルク) termasuk lantai...","フローリングとコルクは何床材ですか。",["Kayu (木質床材)","Keras","Elastis","Karpet"],["木質床材","硬性床材","弾性床材","カーペット床材"],"Hal. 62.",1),
Q(62,"Karpet ubin (タイルカーペット) dan jūtan termasuk...","タイルカーペットとじゅうたんは何ですか。",["Lantai karpet (カーペット床材)","Lantai keras","Lantai kayu","Lantai elastis"],["カーペット床材","硬性床材","木質床材","弾性床材"],"Hal. 62.",1),
Q(63,"Noda bekas gesekan tumit sepatu (ヒールマーク) tergolong kotoran...","ヒールマークはどの汚れですか。",["Larut minyak (油溶性)","Tak organik","Larut air","Infeksius"],["油溶性","無機質","水溶性","感染性"],"Hal. 63: heel mark, sebum = larut minyak.",1),
Q(63,"Debu (tanah, serat kapas) dan abu termasuk kotoran...","ホコリ(土、綿)、灰は何の汚れですか。",["Tak organik (無機質)","Larut air","Larut minyak","Infeksius"],["無機質の汚れ","水溶性","油溶性","感染性の汚れ"],"Hal. 63.",1),
Q(63,"Noda minuman dan bekas tumpahan teh/kopi termasuk kotoran...","染み、飲み物は何の汚れですか。",["Larut air (水溶性)","Larut minyak","Tak organik","Karat/sinar matahari"],["水溶性","油溶性","無機質","その他"],"Hal. 63.",1),
Q(63,"Jamur (カビ) dan tungau (ダニ) termasuk kotoran...","カビ、ダニは何の汚れですか。",["Infeksius (感染性)","Tak organik","Larut minyak","Larut air"],["感染性の汚れ","無機質","油溶性","水溶性"],"Hal. 63.",1),
Q(64,"Detergen apa yang tidak boleh dicampur karena menghasilkan gas beracun?","混ぜてはいけない洗剤の組み合わせはどれですか。",["Berbasis klorin dan bersifat asam","Dua detergen netral","Detergen netral dan air","Detergen lantai dan air"],["塩素系と酸性","中性と中性","中性と水","床用と水"],"Hal. 60, 64: pH diperlihatkan di gambar."),
Q(65,"Prinsip dasar urutan kerja pembersihan menurut gambar?","作業動線の基本はどれですか。",["Atas ke bawah, dalam ke luar, sempit ke luas, sedikit kotor ke banyak kotor","Bawah ke atas, luar ke dalam","Bagian paling kotor dulu","Bebas"],["上から下、奥から手前、狭い所から広い所、汚れの少ない所から多い所","下から上、手前から奥","汚れの多い所から","自由"],"Hal. 65."),
Q(65,"Resin wax (樹脂ワックス) terdiri dari jenis...","樹脂ワックスの種類はどれですか。",["Berbasis uretan dan akrilik","Lilin saja","Lilin dan resin sintetis (emulsi)","Detergen alkali"],["ウレタン系、アクリル系","ロウが主成分","ロウと合成樹脂","アルカリ洗剤"],"Hal. 65: wax = tindakan pencegahan (予防策)."),
Q(66,"Urutan pembersihan lantai vinil yang benar?","床面清掃の流れはどれですか。",["Hilangkan debu → bersihkan lantai → ambil air kotor & lap air → oles wax","Oles wax → bersihkan → hilangkan debu","Bersihkan → hilangkan debu → wax","Lap air → debu → wax"],["除塵→床面清掃→汚水回収・水拭き→床維持剤塗布","床維持剤塗布→床面清掃→除塵","床面清掃→除塵→塗布","水拭き→除塵→塗布"],"Hal. 66."),
Q(21,"Partikel yang tak terlihat mata (virus, bakteri, jamur) dapat...","肉眼で見えない汚れはどうなりますか。",["Masuk ke paru-paru dan mengganggu kesehatan","Hanya tertahan di hidung","Tidak berpengaruh","Hanya merusak penampilan"],["肺に入り込む","鼻でキャッチする","影響しない","美観を損ねるだけ"],"Hal. 21: ukuran < 10 µm."),
Q(22,"Cara memegang sapu bebas (自在ぼうき)?","自在ぼうきの持ち方はどれですか。",["Ujung gagang ditekan jempol tangan atas, jarak kedua tangan 30–40 cm","Digenggam penuh seperti tongkat","Satu tangan dekat sikat","Tanpa jempol"],["先端を上の手の親指で押さえ、30〜40cm離す","棒のように握る","片手で持つ","親指を使わない"],"Hal. 22."),
Q(27,"Cara menggerakkan dust cloth mop?","ダストクロスの動かし方はどれですか。",["Maju di area bersih, jangan diangkat atau mundur","Mundur sambil menggosok","Diangkat tiap beberapa langkah","Bebas"],["前進。浮かせたり後退したりしない","後退しながら","時々持ち上げる","自由"],"Hal. 27."),
Q(30,"Cara menggerakkan mop basah (モップ) dan warna mop untuk toilet?","モップの動かし方とトイレ用の色は?",["Mundur sambil mengayun kiri-kanan; merah untuk toilet","Maju sambil menginjak area yang dipel; putih untuk toilet","Maju; biru untuk toilet","Mundur; hijau untuk toilet"],["後退しながら左右に振る。トイレ用は赤","前進。トイレ用は白","前進。トイレ用は青","後退。トイレ用は緑"],"Hal. 30."),
Q(34,"Mesin penyedot debu apa yang dipakai untuk karpet?","カーペットの清掃に使う掃除機は?",["Tipe upright (アップライト型)","Tipe pod","Tipe wet","Tipe handy"],["アップライト型","ポッド型","ウエット型","ハンディ型"],"Hal. 34, 39."),
Q(40,"Handuk untuk menyeka permukaan datar dilipat berapa?","平面拭きでタオルは何折りにしますか。",["8 lipatan (8つ折り)","2 lipatan","Tidak dilipat","16 lipatan untuk menyeka"],["8つ折り","2つ折り","折らない","16折りで拭く"],"Hal. 40 (16 lipatan untuk memeras, hal. 41)."),
Q(45,"Urutan pembersihan toilet yang benar?","トイレ清掃の順番はどれですか。",["Tempat sampah/isi ulang → wastafel → urinal → kloset → lantai","Lantai → kloset → urinal → wastafel","Kloset → lantai → wastafel","Urinal → lantai → tempat sampah"],["ゴミ箱・補充→洗面台→小便器→大便器→床","床→大便器→小便器→洗面台","大便器→床→洗面台","小便器→床→ゴミ箱"],"Hal. 45: dari sedikit kotor ke banyak kotor."),
Q(59,"Mencuci tangan sebaiknya berapa lama dengan sabun?","手洗いは何秒以上かけますか。",["20 detik atau lebih","5 detik","10 detik tanpa sabun","Tidak perlu jika pakai sarung tangan"],["20秒以上","5秒","10秒(石けんなし)","手袋なら不要"],"Hal. 59."),
Q(71,"Polisher: lebar pad dioverlap sekitar...","ポリッシャーでパッド幅はどのくらい重ねますか。",["Sekitar 1/3","Sekitar 1/10","Tidak perlu overlap","Setengah penuh"],["1/3程度","1/10","重ねない","半分"],"Hal. 71."),
Q(77,"Menyeka kaca dengan squeegee: bagian bawah disisakan sekitar...","スクイジーで下から何cm残して引き降ろしますか。",["20 cm, lalu ditarik mendatar","5 cm","Tidak disisakan","50 cm"],["20cm残して、横引きする","5cm","残さない","50cm"],"Hal. 77-78: overlap squeegee sekitar 1/4.")
];
const U={id:{h:"Simulasi CBT Building Cleaning (SSW)",n:"Soal latihan buatan sendiri dari modul JBMA (bukan soal asli). Lulus jika skor minimal 60%. Format ujian asli: CBT, soal bergambar, benar/salah, pilihan ganda, urutan.",
all:"Ujian penuh",fl:"Latihan lantai, keramik & kotoran",st:"Mulai",pv:"Sebelumnya",nx:"Berikutnya",fg:"Tandai",uf:"Lepas tanda",fin:"Selesai",ok:"LULUS",no:"BELUM LULUS",ya:"Jawabanmu",ca:"Jawaban benar",un:"Tidak dijawab",mn:"Kembali ke menu",q:"Soal",of:"dari",sc:"Skor",rv:"Pembahasan",qs:"soal",mi:"menit",bs:"terbaik",cf:"Selesaikan ujian?",zm:"Ketuk gambar untuk memperbesar"},
ja:{h:"ビルクリーニング CBT模擬試験",n:"JBMAテキストをもとにした練習問題です(本試験ではありません)。60%以上で合格。",
all:"全問題",fl:"床材・汚れの練習",st:"開始",pv:"前へ",nx:"次へ",fg:"印",uf:"印を外す",fin:"終了",ok:"合格",no:"不合格",ya:"あなたの答え",ca:"正解",un:"未回答",mn:"メニューへ",q:"問",of:"/",sc:"得点",rv:"解説",qs:"問",mi:"分",bs:"最高",cf:"終了しますか?",zm:"画像をタップで拡大"}};
let G={l:"id"},S;const T=k=>U[G.l][k];
const fmt=s=>(s/60|0)+":"+String(s%60).padStart(2,"0");
const best=()=>{try{return JSON.parse(localStorage.cbt||"{}")}catch(e){return{}}};
const img=p=>`<div class="zw"><img src="img/p${p}.jpg" alt="Modul hal. ${p}" onclick="this.classList.toggle('z')"></div>`;
function home(){const b=best();
$("#a").innerHTML=`<div class="row"><button class="btn g ${G.l=="id"?"s":""}" onclick="G.l='id';home()">Bahasa Indonesia</button><button class="btn g ${G.l=="ja"?"s":""}" onclick="G.l='ja';home()">日本語</button></div><h1>${T("h")}</h1><p class="m">${T("n")}</p>`+
[["all",0],["fl",1]].map(([k,f])=>{const c=D.filter(x=>!f||x.f).length,id=k+G.l;return`<div class="card"><b>${T(k)}</b><div class="m">${c} ${T("qs")}, ${c} ${T("mi")}${b[id]!=null?`, ${T("bs")} ${b[id]}%`:""}</div><p><button class="btn" onclick="start(${f})">${T("st")}</button></p></div>`}).join("")+fcCard()}
function start(f){const qs=sh(D.filter(x=>!f||x.f)).map(x=>{const k=sh([0,1,2,3]);return{...x,k,a:k.indexOf(0)}});
S={f,qs,r:qs.map(()=>-1),g:qs.map(()=>0),i:0,t:qs.length*60};
S.tm=setInterval(()=>{if(--S.t<=0)finish();else if($("#tm"))$("#tm").textContent=fmt(S.t)},1000);show()}
const qt=q=>G.l=="ja"?q.j:q.q,ot=q=>q.k.map(i=>(G.l=="ja"?q.oj:q.o)[i]);
function show(){const{qs,r,g,i}=S,q=qs[i];
$("#a").innerHTML=`<div class="top"><b>${T("q")} ${i+1} ${T("of")} ${qs.length}</b><b id="tm">${fmt(S.t)}</b></div>
<div class="card">${img(q.p)}<p class="m">${T("zm")}</p><p><b>${qt(q)}</b></p>${ot(q).map((o,j)=>`<button class="opt${r[i]==j?" s":""}" onclick="S.r[S.i]=${j};show()">${"ABCD"[j]}. ${o}</button>`).join("")}</div>
<div class="row"><button class="btn g" onclick="go(${i-1})" ${i?"":"disabled"}>${T("pv")}</button><button class="btn g" onclick="S.g[${i}]^=1;show()">${g[i]?T("uf"):T("fg")}</button><button class="btn g" onclick="go(${i+1})" ${i<qs.length-1?"":"disabled"}>${T("nx")}</button><button class="btn" onclick="confirm(T('cf'))&&finish()">${T("fin")}</button></div>
<div class="card pal">${qs.map((_,j)=>`<button class="${r[j]>=0?"d ":""}${g[j]?"f ":""}${j==i?"c":""}" onclick="go(${j})">${j+1}</button>`).join("")}</div>`}
function go(n){S.i=n;show()}
function finish(){clearInterval(S.tm);const n=S.qs.length,c=S.qs.filter((q,i)=>S.r[i]==q.a).length,pct=Math.round(100*c/n),pass=pct>=60;
try{const b=best(),id=(S.f?"fl":"all")+G.l;b[id]=Math.max(b[id]||0,pct);localStorage.cbt=JSON.stringify(b)}catch(e){}
$("#a").innerHTML=`<h1><span class="${pass?"g1":"r1"}">${pass?T("ok"):T("no")}</span></h1><div class="card"><p>${T("sc")}: <b>${c}/${n}</b> (${pct}%)</p><button class="btn" onclick="home()">${T("mn")}</button></div><h2>${T("rv")}</h2>`+
S.qs.map((q,i)=>{const ok=S.r[i]==q.a,o=ot(q);return`<div class="card">${img(q.p)}<p><b>${i+1}.</b> ${qt(q)}</p><div class="${ok?"g1":"r1"}">${S.r[i]<0?T("un"):T("ya")+": "+o[S.r[i]]}</div>${ok?"":`<div>${T("ca")}: <b>${o[q.a]}</b></div>`}<div class="m">${q.e}</div></div>`}).join("");scrollTo(0,0)}
let V=null,F,FR=0;
const FK=()=>{try{return new Set(JSON.parse(localStorage.fck||"[]"))}catch(e){return new Set()}};
const FS=k=>{try{localStorage.fck=JSON.stringify([...k])}catch(e){}};
const BN=["Semua / 全部","Bab 1 / 第1課","Bab 2 / 第2課","Bab 3 / 第3課"];
function fcCard(){const k=FK().size;return`<div class="card"><b>Flashcard Kotoba 単語カード</b><div class="m">461 kata, 3 bab${k?`, hafal ${k}`:""}</div><div class="row" style="margin-top:10px">`+BN.map((n,b)=>`<button class="btn g" onclick="fcStart(${b},0)">${n}</button>`).join("")+`<button class="btn" onclick="fcStart(0,1)">Belum hafal saja</button></div></div>`}
async function fcStart(b,u){if(!V){try{V=await(await fetch("vocab.json")).json()}catch(e){alert("vocab.json gagal dimuat. Buka lewat server/Vercel, bukan file://");return}}
const k=FK(),d=sh(V.map((v,i)=>i).filter(i=>(!b||V[i][0]==b)&&(!u||!k.has(i))));
if(!d.length){alert("Semua sudah hafal!");return}F={d,i:0,f:0,k};fc()}
function fc(){const{d,i,f,k}=F,id=d[i],v=V[id],front=FR?v[3]:v[1],back=FR?`${v[1]}<div class="s">${v[2]}</div>`:`${v[2]}<div class="s">${v[3]}</div>`;
$("#a").innerHTML=`<div class="top"><b>${i+1} / ${d.length}</b><span class="m">Bab ${v[0]} | hafal ${k.size}/${V.length}</span></div>
<div class="card fc" onclick="F.f^=1;fc()" role="button" tabindex="0">${f?`<div>${front}</div><div class="s">&darr;</div><div>${back}</div>`:`<div>${front}</div><div class="s">(ketuk untuk membalik)</div>`}</div>
<div class="row"><button class="btn g" onclick="fcGo(-1)" ${i?"":"disabled"}>Sebelumnya</button><button class="btn g" onclick="fcMark(0)">Belum hafal</button><button class="btn" onclick="fcMark(1)">Hafal</button></div>
<div class="row" style="margin-top:10px"><button class="btn g" onclick="FR^=1;F.f=0;fc()">Arah: ${FR?"Indonesia &rarr; Jepang":"Jepang &rarr; Indonesia"}</button><button class="btn g" onclick="home()">Menu</button></div>`}
function fcGo(x){F.i+=x;F.f=0;fc()}
function fcMark(ok){const id=F.d[F.i];if(ok)F.k.add(id);else{F.k.delete(id);F.d.push(id)}FS(F.k);
if(F.i+1>=F.d.length){alert("Selesai! Hafal "+F.k.size+"/"+V.length);home();return}fcGo(1)}
home();
</script></body></html>
